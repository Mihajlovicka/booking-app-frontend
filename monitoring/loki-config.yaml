# --- Loki Configuration File (loki-config.yaml) ---
# This configuration is designed for single-binary mode using local storage (Loki 3.x compatible).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095

common:
  # Simplified common block 
  path_prefix: /loki
  replication_factor: 1

# Defines the actual storage configuration for chunks and index using boltdb-shipper
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/boltdb-shipper-active
    cache_location: /loki/boltdb-shipper-cache
  filesystem:
    directory: /loki/chunks # This is where the chunk data will be stored

# Configuration for reading logs from the client (OpenTelemetry Collector)
limits_config:
  # FIX: Temporarily disable structured metadata validation to allow OTLP ingestion 
  # while using the boltdb-shipper index and schema v11.
  allow_structured_metadata: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h

# Configuration for the index (metadata lookup)
schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      # Location of the index files
      index:
        prefix: index_
        period: 24h

ruler:
  # Rulers are used for alerting and recording rules.
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tempo

ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
