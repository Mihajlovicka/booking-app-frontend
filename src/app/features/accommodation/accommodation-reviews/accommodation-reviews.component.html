<div class="reviews-container">
  <h2>Accommodation Reviews</h2>

  <div *ngIf="review.length; else noReviews" class="reviews-grid">
    <mat-card *ngFor="let r of review" class="review-card">
      <mat-card-header>
        <mat-card-title>{{ r.accommodationName }}</mat-card-title>
        <mat-card-subtitle>by {{ r.raterUserName }}</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <p><strong>Accommodation Grade:</strong> {{ r.accommodationGrade }}</p>
        <p><strong>Host:</strong> {{ r.hostUsername }} (Grade: {{ r.hostGrade }})</p>
      </mat-card-content>

      <mat-card-actions *ngIf="editable(r)">
        <button mat-button color="primary" (click)="onReviewClick(r)">Edit</button>
      </mat-card-actions>

      <mat-card-actions *ngIf="editable(r)">
        <button mat-button color="primary" (click)="onDeleteClick(r)">Delete</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <ng-template #noReviews>
    <p class="no-reviews">No reviews found.</p>
  </ng-template>
</div>
